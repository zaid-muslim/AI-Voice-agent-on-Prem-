# Banking domain pack - the real HBL telephone-banking agent, ported from
# the sibling Livekit Pipeline repo (see PLAN_real_banking_domain_pack.md
# at the repo root). Replaces the earlier "Meridian Bank" synthetic proof
# point. Engines are reused as-is from that synthetic pack (Gemma-4-12B +
# whisper_shared + qwen) - already verified on this platform's hardware,
# not the real deployment's own vLLM/Qwen2.5-14B-AWQ + Chatterbox stack.
domain_id: banking
display_name: "HBL Telephone Banking Assistant"
agent_name: banking-agent
timezone: "Asia/Karachi"

persona:
  template_path: "persona.jinja2"
  greeting_template: >
    Greet the caller warmly in one short sentence as {{ bank_name }}'s
    telephone assistant, and ask how you can help them today. Do not
    list your capabilities.
  variables:
    bank_name: "HBL"
    customer_care_number: "111-111-425"

engines:
  llm:
    served_model_name: "gemma-4-12b"
    source: "models/gemma-4-12b-w4a16"
    display_name: "Gemma 4 12B (w4a16)"
  stt:
    engine: "whisper_shared"
    model: "distil-large-v3"
    display_name: "Whisper distil-large-v3 (shared)"
  tts:
    engine: "qwen"
    model: "aiden"
    display_name: "Qwen TTS (aiden voice)"

tools:
  module: "domain_agent_core.packs.banking.tools"
  allow_list:
    - block_card
    - request_human_handoff
    - search_business_docs

safety:
  module: "domain_agent_core.packs.banking.safety_policy"

filler:
  phrases:
    - "One moment, pulling that up."
    - "Let me check that for you."
    - "Just a second."
  per_tool:
    block_card: "One moment, let me verify a few details first."
    request_human_handoff: "One moment, I'm connecting you with a representative."
    search_business_docs: "Let me check that for you."

recap:
  labels:
    - [card_last4, "card last 4"]

kb:
  directory: "kb"

compliance:
  profile: pci_dss_glba

strip_thinking_channel: true
