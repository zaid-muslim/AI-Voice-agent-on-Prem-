<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice Agent</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    background: #0f1115;
    color: #e6e6e6;
    padding: 0 16px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; }
  #history {
    border: 1px solid #2a2d34;
    border-radius: 10px;
    padding: 16px;
    height: 420px;
    overflow-y: auto;
    background: #15181f;
    margin-bottom: 16px;
  }
  .msg { margin-bottom: 12px; line-height: 1.4; }
  .msg .who { font-weight: 600; }
  .msg.you .who { color: #6ea8fe; }
  .msg.agent .who { color: #8ee08e; }
  #controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  #micBtn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    background: #2a2d34;
    color: #fff;
    font-size: 1.6rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, transform 0.1s;
  }
  #micBtn:active, #micBtn.recording {
    background: #d9534f;
    transform: scale(1.05);
  }
  #uploadBtn {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1b1e25;
    color: #e6e6e6;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #uploadBtn:hover { background: #22262f; }
  #status {
    color: #9aa0a6;
    font-size: 0.95rem;
  }
  #textForm {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  #textInput {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1b1e25;
    color: #e6e6e6;
    font-size: 0.95rem;
  }
  #textInput:focus { outline: 1px solid #6ea8fe; }
  #sendBtn {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1b1e25;
    color: #e6e6e6;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #sendBtn:hover { background: #22262f; }
  #startOverlay {
    text-align: center;
    padding: 48px 16px;
    border: 1px solid #2a2d34;
    border-radius: 10px;
    background: #15181f;
    margin-bottom: 16px;
  }
  #startBtn {
    padding: 14px 28px;
    border-radius: 8px;
    border: none;
    background: #6ea8fe;
    color: #0f1115;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }
  #startBtn:hover { background: #8bb9ff; }
  #startHint {
    margin-top: 12px;
    color: #9aa0a6;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <h1>Voice Agent</h1>
  <div id="history"></div>
  <div id="startOverlay">
    <button id="startBtn">▶ Start Call</button>
    <div id="startHint">Your browser requires a click before it will play audio — the agent
      greets you right after you start.</div>
  </div>
  <div id="controls" style="display:none">
    <button id="micBtn">🎙</button>
    <button id="uploadBtn" type="button">📁 Upload audio</button>
    <input id="fileInput" type="file" accept="audio/*" style="display:none">
    <div id="status">Connecting…</div>
  </div>
  <form id="textForm" autocomplete="off" style="display:none">
    <input id="textInput" type="text" placeholder="Or type a message instead of speaking…">
    <button id="sendBtn" type="submit">Send</button>
  </form>

<script>
const historyEl = document.getElementById("history");
const micBtn = document.getElementById("micBtn");
const statusEl = document.getElementById("status");

let ws;
let audioCtx;
let currentAgentBubble = null;

function setStatus(text) { statusEl.textContent = text; }

function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function appendMessage(who, text) {
  const div = document.createElement("div");
  div.className = "msg " + (who === "You" ? "you" : "agent");
  div.innerHTML = `<span class="who">${who}:</span> <span class="text"></span>`;
  div.querySelector(".text").textContent = text;
  historyEl.appendChild(div);
  historyEl.scrollTop = historyEl.scrollHeight;
  return div;
}

function appendAgentToken(text) {
  if (!currentAgentBubble) {
    currentAgentBubble = appendMessage("Agent", "");
  }
  currentAgentBubble.querySelector(".text").textContent += text;
  historyEl.scrollTop = historyEl.scrollHeight;
}

function base64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function arrayBufferToBase64(buffer) {
  let binary = "";
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

// Gapless playback: each decoded chunk is scheduled on the Web Audio clock to start
// exactly when the previous one ends (this.nextTime), so sentences play back-to-back
// with no JS-event-latency gaps. If a chunk arrives late (TTS underrun), it self-heals
// by scheduling from "now" instead. A small lead (SCHEDULE_LEAD) absorbs jitter.
class AudioQueue {
  constructor() { this.nextTime = 0; this.sources = new Set(); this.SCHEDULE_LEAD = 0.15; this.playing = false; }
  // Tell the server whether agent audio is actually playing. The server needs this
  // because audio is scheduled ahead and keeps playing after generation finishes —
  // it's what lets barge-in interrupt still-playing audio.
  _setPlaying(playing) {
    if (playing === this.playing) return;
    this.playing = playing;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "playback_state", playing }));
    }
  }
  async enqueue(arrayBuffer) {
    const ctx = getAudioContext();
    if (ctx.state === "suspended") { try { await ctx.resume(); } catch (e) { /* ignore */ } }
    let buf;
    try {
      buf = await ctx.decodeAudioData(arrayBuffer);
    } catch (err) {
      console.error("Audio chunk failed to decode, dropped:", arrayBuffer.byteLength, "bytes", err);
      setStatus("Warning: an audio chunk failed to play");
      return;
    }
    const startAt = Math.max(this.nextTime, ctx.currentTime + this.SCHEDULE_LEAD);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.onended = () => {
      this.sources.delete(src);
      if (this.sources.size === 0) this._setPlaying(false);
    };
    this.sources.add(src);
    src.start(startAt);
    this.nextTime = startAt + buf.duration;
    this._setPlaying(true);
  }
  stopAll() {
    for (const src of this.sources) {
      src.onended = null;
      try { src.stop(); } catch (err) { /* already stopped */ }
    }
    this.sources.clear();
    this.nextTime = 0;
    this._setPlaying(false);
  }
}
const audioQueue = new AudioQueue();

function connect() {
  ws = new WebSocket("ws://localhost:8765");
  ws.binaryType = "arraybuffer";

  ws.onopen = () => setStatus("Ready");
  ws.onclose = () => { setStatus("Disconnected — retrying…"); setTimeout(connect, 2000); };
  ws.onerror = () => setStatus("Connection error");

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "transcript") {
      appendMessage("You", msg.text);
      currentAgentBubble = null;
    }
    if (msg.type === "token") {
      appendAgentToken(msg.text);
    }
    if (msg.type === "audio") {
      const wav = base64ToArrayBuffer(msg.data);
      await audioQueue.enqueue(wav);
    }
    if (msg.type === "done") {
      setStatus(listening ? "Listening…" : "Ready");
      currentAgentBubble = null;
    }
    if (msg.type === "error") {
      setStatus("Error: " + msg.message);
    }
    if (msg.type === "interrupted") {
      audioQueue.stopAll();
      currentAgentBubble = null;
      setStatus(listening ? "Listening…" : "Ready");
    }
    if (msg.type === "guardrail") {
      // Server suppressed an unverified block/verification claim it had begun streaming for
      // display — clear the current bubble so the fabricated text doesn't linger; the truthful
      // replacement line arrives right after as normal tokens.
      if (currentAgentBubble) currentAgentBubble.querySelector(".text").textContent = "";
    }
  };
}
const startOverlay = document.getElementById("startOverlay");
const startBtn = document.getElementById("startBtn");
const controlsEl = document.getElementById("controls");
const textFormEl = document.getElementById("textForm");

// The WebSocket (and so the server's auto-greeting, which fires the instant it connects) only
// opens after this click. That's deliberate: browsers block audio playback until a genuine user
// gesture has occurred, and the AudioContext must be created/resumed synchronously within that
// gesture. Without this gate, the greeting's audio would get scheduled into a still-suspended
// context before any click ever happens — it wouldn't play, then would surface late and
// out of order once some later interaction finally unlocked the context.
startBtn.addEventListener("click", () => {
  const ctx = getAudioContext();
  if (ctx.state === "suspended") ctx.resume().catch(() => {});
  startOverlay.style.display = "none";
  controlsEl.style.display = "flex";
  textFormEl.style.display = "flex";
  connect();
});

// Real-time mode: mic streams continuously once toggled on. The server runs VAD
// on the raw PCM stream, segments utterances by speech/silence, and auto-interrupts
// the agent the instant it detects you've started talking (barge-in) — no button
// press needed for either.
let listening = false;
let micStream = null;
let captureCtx = null;   // separate AudioContext, forced to 16kHz to match the VAD/STT pipeline
let workletNode = null;

async function startListening() {
  if (listening) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
    });
    captureCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    await captureCtx.audioWorklet.addModule("pcm-worklet.js");
    const source = captureCtx.createMediaStreamSource(micStream);
    workletNode = new AudioWorkletNode(captureCtx, "pcm-capture");
    workletNode.port.onmessage = (event) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(event.data);   // raw 20ms Int16 PCM frame
      }
    };
    source.connect(workletNode);
    listening = true;
    micBtn.classList.add("recording");
    setStatus("Listening…");
  } catch (err) {
    console.error("Failed to start listening:", err);
    setStatus("Mic error: " + err.message);
  }
}

function stopListening() {
  if (!listening) return;
  if (workletNode) { workletNode.port.onmessage = null; workletNode.disconnect(); workletNode = null; }
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
  if (captureCtx) { captureCtx.close(); captureCtx = null; }
  listening = false;
  micBtn.classList.remove("recording");
  setStatus("Ready");
}

micBtn.addEventListener("click", () => {
  if (listening) stopListening(); else startListening();
});

const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");

uploadBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  const buf = await file.arrayBuffer();
  console.log("Uploaded file bytes:", buf.byteLength, file.type);
  if (buf.byteLength === 0) {
    setStatus("Empty file");
  } else if (ws.readyState === WebSocket.OPEN) {
    audioQueue.stopAll();
    ws.send(JSON.stringify({ type: "upload_audio", data: arrayBufferToBase64(buf) }));
    setStatus("Thinking…");
  } else {
    setStatus("Not connected to server");
  }
});

const textForm = document.getElementById("textForm");
const textInput = document.getElementById("textInput");

// Typed text skips STT entirely — the server takes the text as-is and runs the same
// LLM (+ tool-calling) + TTS pipeline as a spoken turn.
textForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = textInput.value.trim();
  if (!text) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    audioQueue.stopAll();
    ws.send(JSON.stringify({ type: "text_input", text }));
    textInput.value = "";
    setStatus("Thinking…");
  } else {
    setStatus("Not connected to server");
  }
});
</script>
</body>
</html>
