<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice Agent</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    background: #0f1115;
    color: #e6e6e6;
    padding: 0 16px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; }
  #history {
    border: 1px solid #2a2d34;
    border-radius: 10px;
    padding: 16px;
    height: 420px;
    overflow-y: auto;
    background: #15181f;
    margin-bottom: 16px;
  }
  .msg { margin-bottom: 12px; line-height: 1.4; }
  .msg .who { font-weight: 600; }
  .msg.you .who { color: #6ea8fe; }
  .msg.agent .who { color: #8ee08e; }
  #controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  #micBtn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    background: #2a2d34;
    color: #fff;
    font-size: 1.6rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, transform 0.1s;
  }
  #micBtn.recording { background: #3a7d44; }
  #micBtn.muted { background: #d9534f; }
  #status {
    color: #9aa0a6;
    font-size: 0.95rem;
  }
  #textForm {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  #textInput {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1b1e25;
    color: #e6e6e6;
    font-size: 0.95rem;
  }
  #textInput:focus { outline: 1px solid #6ea8fe; }
  #sendBtn {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1b1e25;
    color: #e6e6e6;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #sendBtn:hover { background: #22262f; }
  #startOverlay {
    text-align: center;
    padding: 48px 16px;
    border: 1px solid #2a2d34;
    border-radius: 10px;
    background: #15181f;
    margin-bottom: 16px;
  }
  #startBtn {
    padding: 14px 28px;
    border-radius: 8px;
    border: none;
    background: #6ea8fe;
    color: #0f1115;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }
  #startBtn:hover { background: #8bb9ff; }
  #startBtn:disabled { background: #3a3f4a; cursor: default; }
  #startHint {
    margin-top: 12px;
    color: #9aa0a6;
    font-size: 0.9rem;
  }
  #startError {
    margin-top: 12px;
    color: #ff8080;
    font-size: 0.9rem;
    display: none;
  }
  #modelSelectOverlay {
    padding: 24px;
    border: 1px solid #2a2d34;
    border-radius: 10px;
    background: #15181f;
    margin-bottom: 16px;
  }
  #modelSelectOverlay h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 16px; }
  #modelPicker fieldset {
    border: 1px solid #2a2d34;
    border-radius: 8px;
    margin-bottom: 12px;
    padding: 10px 14px;
  }
  #modelPicker legend {
    padding: 0 6px;
    color: #9aa0a6;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  #modelPicker label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #confirmBtn {
    margin-top: 8px;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    background: #6ea8fe;
    color: #0f1115;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #confirmBtn:hover { background: #8bb9ff; }
  #confirmBtn:disabled { background: #3a3f4a; cursor: default; }
  .progressRow {
    padding: 8px 0;
    font-size: 0.95rem;
    color: #e6e6e6;
    border-bottom: 1px solid #2a2d34;
  }
  .progressRow:last-child { border-bottom: none; }
  .progressStatus { color: #9aa0a6; }
  .progressStatus.loading { color: #6ea8fe; }
  .progressStatus.ready { color: #8ee08e; }
  .progressStatus.error { color: #ff8080; }
  #modelSelectError {
    margin-top: 12px;
    color: #ff8080;
    font-size: 0.9rem;
    display: none;
  }
</style>
</head>
<body>
  <h1>Voice Agent</h1>
  <div id="history"></div>
  <div id="modelSelectOverlay">
    <h2>Choose your pipeline</h2>
    <div id="modelPicker">
      <fieldset id="llmChoices"><legend>LLM</legend></fieldset>
      <fieldset id="sttChoices"><legend>Speech-to-text</legend></fieldset>
      <fieldset id="ttsChoices"><legend>Text-to-speech</legend></fieldset>
      <button id="confirmBtn">Confirm &amp; Load Models</button>
    </div>
    <div id="loadProgress" style="display:none">
      <div class="progressRow" data-cat="llm">LLM: <span class="progressStatus">pending</span></div>
      <div class="progressRow" data-cat="stt">STT: <span class="progressStatus">pending</span></div>
      <div class="progressRow" data-cat="tts">TTS: <span class="progressStatus">pending</span></div>
    </div>
    <div id="modelSelectError"></div>
  </div>
  <div id="startOverlay" style="display:none">
    <button id="startBtn">▶ Start Call</button>
    <div id="startHint">Joins a LiveKit room and connects you with the agent — your browser
      will ask for microphone permission.</div>
    <div id="startError"></div>
  </div>
  <div id="controls" style="display:none">
    <button id="micBtn">🎙</button>
    <div id="status">Connecting…</div>
  </div>
  <form id="textForm" autocomplete="off" style="display:none">
    <input id="textInput" type="text" placeholder="Or type a message instead of speaking…">
    <button id="sendBtn" type="submit">Send</button>
  </form>

<script type="module">
import { Room, RoomEvent, Track } from "./vendor/livekit-client.esm.mjs";

const historyEl = document.getElementById("history");
const micBtn = document.getElementById("micBtn");
const statusEl = document.getElementById("status");
const startOverlay = document.getElementById("startOverlay");
const startBtn = document.getElementById("startBtn");
const startErrorEl = document.getElementById("startError");
const controlsEl = document.getElementById("controls");
const textFormEl = document.getElementById("textForm");
const textInput = document.getElementById("textInput");

const modelSelectOverlay = document.getElementById("modelSelectOverlay");
const modelPicker = document.getElementById("modelPicker");
const loadProgress = document.getElementById("loadProgress");
const modelSelectError = document.getElementById("modelSelectError");
const confirmBtn = document.getElementById("confirmBtn");

let room = null;
let micEnabled = false;

function setStatus(text) { statusEl.textContent = text; }

// #status lives inside #controls, which is still hidden before a successful connect — an error
// during startCall() would otherwise be set but literally invisible. Mirror it here too.
function showStartError(text) {
  setStatus(text);
  startErrorEl.textContent = text;
  startErrorEl.style.display = "block";
}

if (!window.isSecureContext) {
  showStartError(
    "This page isn't loaded over a secure origin (HTTPS, or localhost) — your browser will " +
    "block microphone access. You'll still be able to connect and type, but not speak."
  );
}

function appendMessage(who, text) {
  const div = document.createElement("div");
  div.className = "msg " + (who === "You" ? "you" : "agent");
  div.innerHTML = `<span class="who">${who}:</span> <span class="text"></span>`;
  div.querySelector(".text").textContent = text;
  historyEl.appendChild(div);
  historyEl.scrollTop = historyEl.scrollHeight;
  return div;
}

// Agent state ("listening" | "thinking" | "speaking" | "idle" | "initializing") is published
// automatically by AgentSession as the agent participant's `lk.agent.state` attribute — this
// drives the status line instead of any bespoke protocol message.
const AGENT_STATE_LABELS = {
  initializing: "Connecting…",
  idle: "Ready",
  listening: "Listening…",
  thinking: "Thinking…",
  speaking: "Agent speaking…",
};

function applyAgentState(participant) {
  const state = participant.attributes && participant.attributes["lk.agent.state"];
  if (participant.isAgent && state) setStatus(AGENT_STATE_LABELS[state] || state);
}

async function startCall() {
  startBtn.disabled = true;
  setStatus("Connecting…");

  let token, url;
  try {
    let resp;
    try {
      resp = await fetch("/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
    } catch (networkErr) {
      throw new Error("Couldn't reach the token server: " + networkErr.message);
    }
    if (!resp.ok) {
      // 503 = at the concurrent-call cap (see token_server.py's _active_call_count check) — its
      // message ("Line is full...") is already user-facing, show it as-is, no extra framing.
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || `token request failed: ${resp.status}`);
    }
    ({ token, url } = await resp.json());
  } catch (err) {
    console.error("Failed to get access token:", err);
    showStartError(err.message);
    startBtn.disabled = false;
    return;
  }

  room = new Room({ adaptiveStream: true, dynacast: true });

  // Both the caller's own live STT transcript and the agent's spoken transcript arrive on this
  // one topic (AgentSession's RoomIO convention), distinguished by sender identity. Each call to
  // the handler corresponds to one growing utterance/segment — chunks are incremental text to
  // append, not the full text resent each time.
  //
  // Known livekit-agents quirk (confirmed against the SDK source, not a bug in this app): the
  // caller's own transcript output is built with is_delta_stream=False, and for every final STT
  // result RoomIO calls capture_text(full_text) *then* flush() — each of which independently
  // publishes a complete text stream with the same content, so the same utterance arrives twice.
  // Both copies share the same lk.segment_id attribute, so dedupe on that.
  const seenTranscriptSegments = new Set();
  room.registerTextStreamHandler("lk.transcription", async (reader, participantInfo) => {
    const segmentId = reader.info.attributes && reader.info.attributes["lk.segment_id"];
    if (segmentId) {
      if (seenTranscriptSegments.has(segmentId)) return;
      seenTranscriptSegments.add(segmentId);
    }
    const isYou = participantInfo.identity === room.localParticipant.identity;
    const bubble = appendMessage(isYou ? "You" : "Agent", "");
    for await (const chunk of reader) {
      bubble.querySelector(".text").textContent += chunk;
      historyEl.scrollTop = historyEl.scrollHeight;
    }
  });

  room.on(RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === Track.Kind.Audio) {
      const el = track.attach();
      el.style.display = "none";
      document.body.appendChild(el);
    }
  });

  room.on(RoomEvent.ParticipantAttributesChanged, (_changed, participant) => applyAgentState(participant));
  room.on(RoomEvent.ParticipantConnected, (participant) => applyAgentState(participant));
  room.on(RoomEvent.Disconnected, () => {
    setStatus("Disconnected");
    micBtn.classList.remove("recording", "muted");
  });

  try {
    await room.connect(url, token);
    for (const p of room.remoteParticipants.values()) applyAgentState(p);
  } catch (err) {
    console.error("Failed to connect to the room:", err);
    showStartError("Connection error: " + err.message);
    startBtn.disabled = false;
    return;
  }

  // Mic access is best-effort, not a precondition for the rest of the UI: it routinely fails on
  // an insecure origin (see the isSecureContext check above) even though the room connection
  // itself — and so typed text — works fine. Don't strand the user on the start screen for it.
  try {
    await room.localParticipant.setMicrophoneEnabled(true);
    micEnabled = true;
    micBtn.classList.add("recording");
  } catch (err) {
    console.error("Failed to enable microphone:", err);
    micEnabled = false;
    micBtn.classList.add("muted");
    micBtn.disabled = true;
    micBtn.title = "Microphone unavailable: " + err.message;
  }

  startOverlay.style.display = "none";
  controlsEl.style.display = "flex";
  textFormEl.style.display = "flex";
  setStatus(micEnabled ? "Listening…" : "Mic unavailable — you can still type");
}

startBtn.addEventListener("click", startCall);

// Real-time listening is continuous once connected (Silero VAD + barge-in run server-side,
// same as before) — this button is a mute toggle, not a start/stop-listening switch.
micBtn.addEventListener("click", async () => {
  if (!room) return;
  micEnabled = !micEnabled;
  await room.localParticipant.setMicrophoneEnabled(micEnabled);
  micBtn.classList.toggle("recording", micEnabled);
  micBtn.classList.toggle("muted", !micEnabled);
  setStatus(micEnabled ? "Listening…" : "Muted");
});

// Typed text skips STT entirely — the agent takes the text as-is and runs the same
// LLM (+ tool-calling) + TTS pipeline as a spoken turn (AgentSession's `lk.chat` text-input topic).
// Unlike speech, nothing ever echoes typed text back on `lk.transcription` (there's no STT pass
// to republish) — render the "You" bubble locally instead of waiting for a round-trip that
// will never arrive.
textFormEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = textInput.value.trim();
  if (!text || !room) return;
  textInput.value = "";
  appendMessage("You", text);
  try {
    await room.localParticipant.sendText(text, { topic: "lk.chat" });
  } catch (err) {
    console.error("Failed to send text:", err);
    setStatus("Failed to send: " + err.message);
  }
});

// ── Model selection (gates everything above): the pipeline loads nothing on the backend until
// a choice is confirmed here. Shown first; #startOverlay stays hidden until orchestration
// (src/orchestrator.py, via token_server.py's /api/selection endpoints) reports every backend
// ready. Selection is per pipeline-run, not per-call — once confirmed it can't be changed
// without restarting the whole pipeline (Ctrl+C run.sh and rerun).
const CATEGORY_LABELS = { llm: "LLM", stt: "STT", tts: "TTS" };

function showModelSelectError(text) {
  modelSelectError.textContent = text;
  modelSelectError.style.display = "block";
}

function renderChoices(fieldset, category, entries) {
  for (const entry of entries) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "radio";
    input.name = category;
    input.value = entry.id;
    if (entries.length === 1) input.checked = true;   // only one option today — pre-select it
    label.appendChild(input);
    label.appendChild(document.createTextNode(entry.label));
    fieldset.appendChild(label);
  }
}

function showProgress(status) {
  for (const [category, state] of Object.entries(status.backends || {})) {
    const row = loadProgress.querySelector(`.progressRow[data-cat="${category}"] .progressStatus`);
    if (row) {
      row.textContent = state.status;
      row.className = "progressStatus " + state.status;
    }
  }
}

function revealStartOverlay() {
  modelSelectOverlay.style.display = "none";
  startOverlay.style.display = "block";
}

function pollSelectionStatus() {
  const iv = setInterval(async () => {
    let status;
    try {
      status = await (await fetch("/api/selection/status")).json();
    } catch (err) {
      return;   // transient fetch failure — try again next tick
    }
    showProgress(status);
    if (status.phase === "ready") {
      clearInterval(iv);
      revealStartOverlay();
    } else if (status.phase === "error") {
      clearInterval(iv);
      showModelSelectError(status.error || "Failed to load the selected models.");
    }
  }, 1000);
}

async function confirmSelection() {
  const selection = {};
  for (const category of Object.keys(CATEGORY_LABELS)) {
    const checked = document.querySelector(`input[name="${category}"]:checked`);
    if (!checked) return showModelSelectError(`Please choose a ${CATEGORY_LABELS[category]} option.`);
    selection[category] = checked.value;
  }
  confirmBtn.disabled = true;
  try {
    const resp = await fetch("/api/selection", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(selection),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `request failed: ${resp.status}`);
    }
  } catch (err) {
    console.error("Failed to submit selection:", err);
    showModelSelectError("Failed to start loading: " + err.message);
    confirmBtn.disabled = false;
    return;
  }
  modelPicker.style.display = "none";
  loadProgress.style.display = "block";
  pollSelectionStatus();
}

async function initModelSelect() {
  let status;
  try {
    status = await (await fetch("/api/selection/status")).json();
  } catch (err) {
    return showModelSelectError("Couldn't reach the token server: " + err.message);
  }

  // Handles a page reload mid-loading or after the pipeline is already up.
  if (status.phase === "ready") return revealStartOverlay();
  if (status.phase === "loading") {
    modelPicker.style.display = "none";
    loadProgress.style.display = "block";
    showProgress(status);
    pollSelectionStatus();
    return;
  }
  if (status.phase === "error") return showModelSelectError(status.error || "Pipeline failed to load.");

  let models;
  try {
    models = await (await fetch("/api/models")).json();
  } catch (err) {
    return showModelSelectError("Couldn't load available models: " + err.message);
  }
  renderChoices(document.getElementById("llmChoices"), "llm", models.llm || []);
  renderChoices(document.getElementById("sttChoices"), "stt", models.stt || []);
  renderChoices(document.getElementById("ttsChoices"), "tts", models.tts || []);
  confirmBtn.addEventListener("click", confirmSelection);
}

initModelSelect();
</script>
</body>
</html>
