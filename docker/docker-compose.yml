# PC1 stack: everything except the remote Qwen-Omni TTS box (that's
# docker-compose.pc2.yml, run on the second machine). Run from the repo
# root with:
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Needs the NVIDIA Container Toolkit installed on the host (confirmed
# present: `docker info | grep -i runtime` should list `nvidia`).
name: riverside-voice-agent

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  livekit-server:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml", "--dev"]
    env_file:
      - ../app/.env   # supplies LIVEKIT_KEYS - see app/livekit.yaml's header comment
    volumes:
      - ../app/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "20000-21000:20000-21000/udp"
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    <<: *gpu
    environment:
      - VLLM_ATTENTION_BACKEND=TRITON_ATTN
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ../models:/models:ro
      - ../chat_templates:/chat_templates:ro
      - vllm-hf-cache:/root/.cache/huggingface
    # Same flags as scripts/run_vllm.sh - see that file's comments for the
    # full GPU-memory-budget reasoning behind each value on a 24GB card,
    # including change #6 (2026-07-29) for why max-model-len and the
    # default util below were raised together, not independently.
    command: >
      --model /models/gemma-4-12b-w4a16
      --served-model-name gemma-4-12b
      --host 0.0.0.0 --port 8000
      --max-model-len 16384
      --limit-mm-per-prompt '{"audio": 1}'
      --max-num-seqs 4
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.65}
      --kv-cache-dtype bfloat16
      --generation-config vllm
      --disable-log-stats
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --chat-template /chat_templates/tool_chat_template_gemma4.jinja
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # Profile "cascade" - only the Whisper+LLM pipeline needs this; the
  # direct-audio pipeline talks to Gemma directly and never calls this
  # service at all. Not started when you bring up "direct-audio" alone -
  # see the profile note on `agent` below for the real contention this
  # fixes.
  stt-service:
    build:
      context: ..
      dockerfile: docker/stt.Dockerfile
    <<: *gpu
    profiles: ["cascade"]
    environment:
      - STT_MODEL=${STT_MODEL:-distil-large-v3}
      - STT_NUM_WORKERS=${STT_NUM_WORKERS:-4}
    volumes:
      - stt-hf-cache:/root/.cache/huggingface
    ports:
      - "8020:8020"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://localhost:8020/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Shared local Qwen3-TTS 0.6B service - OPT-IN (see the "local-tts"
  # profile below), not started by a plain `docker compose up -d --build`.
  # Fast local alternative to the default remote PC2 path (~227ms vs
  # ~523ms to first audio, measured - see README §3/§4/§6), at the cost
  # of THIS machine's GPU budget. Enable with:
  #   docker compose -f docker/docker-compose.yml --profile local-tts up -d --build
  # then set system_config.json's tts.engine to "qwen_shared".
  tts-service:
    build:
      context: ..
      dockerfile: docker/tts.Dockerfile
    <<: *gpu
    profiles: ["local-tts"]
    volumes:
      - ../models:/models:ro
    ports:
      - "8021:8021"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://localhost:8021/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Profile "cascade" - the existing Whisper+LLM worker. Deliberately
  # NOT started by a bare `docker compose up` anymore, and deliberately
  # NOT bundled with `direct-audio-agent` under the same profile:
  # measured directly (2026-07-29) that running both workers at once on
  # this GPU causes real contention - Silero VAD logged "inference is
  # slower than realtime" (delay up to 0.52s) with the card at 86%
  # memory used, each worker paying its own VAD/RAG-embedder overhead
  # for no benefit if you only intend to test one pipeline at a time.
  # Bring this one up with:
  #   docker compose -f docker/docker-compose.yml --profile cascade up -d --build
  agent:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    <<: *gpu
    profiles: ["cascade"]
    command: ["python3", "main.py", "start"]
    env_file:
      - ../app/.env
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - SHARED_STT_BASE_URL=http://stt-service:8020
      # tts-service is opt-in (profile "local-tts") - this URL is only
      # ever used if system_config.json's tts.engine is "qwen_shared";
      # harmless if that service isn't running (same graceful
      # reachability-check-then-fallback pattern as PC2/qwen_omni).
      - SHARED_TTS_BASE_URL=http://tts-service:8021
      - LIVEKIT_URL=ws://livekit-server:7880
    volumes:
      - ../app/hospital_core:/srv/app/hospital_core
    depends_on:
      livekit-server:
        condition: service_started
      vllm:
        condition: service_healthy
      stt-service:
        condition: service_healthy
    restart: unless-stopped

  # Profile "cascade" - the caller-facing entry point for the Whisper
  # pipeline specifically (mints tokens that auto-dispatch to `agent`,
  # which only exists under this same profile).
  token-server:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    profiles: ["cascade"]
    command: ["uvicorn", "token_server:app", "--host", "0.0.0.0", "--port", "7860"]
    env_file:
      - ../app/.env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
    ports:
      - "7860:7860"
    depends_on:
      - livekit-server
    restart: unless-stopped

  admin-server:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    command: ["uvicorn", "admin_server:app", "--host", "0.0.0.0", "--port", "7870"]
    env_file:
      - ../app/.env
    volumes:
      - ../app/hospital_core:/srv/app/hospital_core
    ports:
      - "7870:7870"
    restart: unless-stopped

  dev-server:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    command: ["uvicorn", "dev_server:app", "--host", "0.0.0.0", "--port", "7871"]
    env_file:
      - ../app/.env
    ports:
      - "7871:7871"
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Direct-audio pipeline (direct_audio_agent/) - a SEPARATE LiveKit
  # worker + its own call server, under profile "direct-audio". Talks to
  # the SAME vllm/livekit-server containers, reuses RiversideReceptionist
  # (persona/tools/safety-gate) from app/ read-only - see
  # direct_audio_agent/README.md for the full architecture.
  #
  # DELIBERATELY its own profile, not bundled with `agent`'s "cascade"
  # profile and not started by a bare `docker compose up`: explicit
  # LiveKit dispatch (agent_name) already makes it SAFE to run both
  # workers at once (neither can steal the other's room), but "safe"
  # isn't "free" - measured directly (2026-07-29) that running both GPU
  # worker processes simultaneously causes real contention (Silero VAD
  # fell behind realtime, GPU memory at 86%). Pick one:
  #   docker compose -f docker/docker-compose.yml --profile cascade up -d --build
  #   docker compose -f docker/docker-compose.yml --profile direct-audio up -d --build
  # Both at once still works if you genuinely want that (e.g. a beefier
  # GPU) - just pass both profile flags.
  direct-audio-agent:
    build:
      context: ..
      dockerfile: docker/direct-audio.Dockerfile
    <<: *gpu
    profiles: ["direct-audio"]
    command: ["python3", "agent.py", "start"]
    env_file:
      - ../app/.env
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - SHARED_TTS_BASE_URL=http://tts-service:8021
      - LIVEKIT_URL=ws://livekit-server:7880
    volumes:
      - ../app/hospital_core:/srv/app/hospital_core
    depends_on:
      livekit-server:
        condition: service_started
      vllm:
        condition: service_healthy
    restart: unless-stopped

  # Lets you actually CALL the direct-audio agent from a browser - mints
  # tokens with EXPLICIT dispatch to direct-audio-agent (agent_name=
  # "direct-audio-receptionist"), so it can never collide with
  # token-server's auto-dispatched tokens for the existing pipeline.
  # Same frontend/index.html, different port: whisper/cascade is :7860,
  # direct-audio is :7862.
  direct-audio-call-server:
    build:
      context: ..
      dockerfile: docker/direct-audio.Dockerfile
    profiles: ["direct-audio"]
    command: ["python3", "call_server.py"]
    env_file:
      - ../app/.env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
    ports:
      - "7862:7862"
    depends_on:
      - livekit-server
    restart: unless-stopped

volumes:
  vllm-hf-cache:
  stt-hf-cache:
